<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1F3F5;
  --surface: #FFFFFF;
  --field: #F6F7F9;
  --ink: #16212C;
  --ink-2: #3A4754;
  --muted: #66727F;
  --line: #DAE0E6;
  --line-soft: #E8EBEF;
  --track: #E6E9ED;
  --income: #1B6EDC;
  --expense: #C8392A;
  --on-color: #FFFFFF;
  --warn: #B26B00;
  --focus: #1B6EDC;
  --btn-bg: #16212C;
  --btn-fg: #FFFFFF;
  --notice-bg: #FFF5DB;
  --toast-bg: #16212C;
  --toast-fg: #F1F3F5;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1319;
    --surface: #161D25;
    --field: #1B242D;
    --ink: #E8EDF2;
    --ink-2: #BFC9D3;
    --muted: #8D99A6;
    --line: #28323D;
    --line-soft: #202A34;
    --track: #26303B;
    --income: #6AA7FF;
    --expense: #FF7B6B;
    --on-color: #0E1319;
    --warn: #E3B04B;
    --focus: #6AA7FF;
    --btn-bg: #E8EDF2;
    --btn-fg: #0E1319;
    --notice-bg: #2B2716;
    --toast-bg: #E8EDF2;
    --toast-fg: #0E1319;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 56px;
}
@media (min-width: 700px) {
  .wrap { padding-inline: 28px; padding-block: 28px 72px; }
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.won { font-family: var(--sans); font-size: .8em; margin-left: 2px; opacity: .7; }
.label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }

/* ---------- header ---------- */
.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px 20px; margin-bottom: 18px;
}
.brandrow { display: flex; align-items: center; gap: 12px; }
.brand { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.month { display: flex; align-items: center; gap: 4px; }
.month-label { min-width: 8.5em; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.navbtn {
  width: 38px; height: 38px; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--ink-2);
}
.navbtn:hover { background: var(--field); color: var(--ink); }
.chip {
  height: 28px; padding: 0 11px; border-radius: 14px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.chip:hover { background: var(--field); }
@media (max-width: 519px) {
  .month { width: 100%; }
  .month-label { flex: 1; }
}

/* ---------- shared surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pad { padding: 18px 20px; }

.notice {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 8px 14px; padding: 12px 20px; background: var(--notice-bg);
  font-size: 13.5px; line-height: 1.45;
}
.notice.top-warn { border-radius: 12px; margin-bottom: 14px; }
.list-panel .notice { border-radius: 12px 12px 0 0; border-bottom: 1px solid var(--line-soft); }

.btn {
  height: 42px; padding: 0 18px; border-radius: 8px; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:hover { background: var(--field); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn.primary:hover { opacity: .9; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--expense); }
.linkbtn { border: 0; background: none; padding: 2px 0; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--ink); }

/* ---------- summary ---------- */
.summary { display: grid; grid-template-columns: minmax(0, 1fr); margin-bottom: 16px; }
.summary > * { padding: 18px 20px; min-width: 0; }
.summary > * + * { border-top: 1px solid var(--line-soft); }
@media (min-width: 860px) {
  .summary { grid-template-columns: 1.15fr 1fr 1.25fr; }
  .summary > * + * { border-top: 0; border-left: 1px solid var(--line-soft); }
}
.big { margin-top: 6px; font-size: clamp(30px, 8vw, 42px); font-weight: 500; line-height: 1.15; }
.big .num { font-weight: 500; letter-spacing: -0.03em; }
.big .won { font-size: .42em; margin-left: 4px; }
.big .sign { font-family: var(--mono); }
.big.neg { color: var(--expense); }
.flows { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0; }
.flow dt { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.flow dd { margin: 4px 0 0; font-size: 20px; font-weight: 500; }
.flow.in dd { color: var(--income); }
.flow.out dd { color: var(--expense); }
@media (min-width: 860px) { .flows { grid-template-columns: 1fr; gap: 14px; } }
.hint { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.b-head { display: flex; justify-content: space-between; align-items: baseline; }
.b-amount { margin-top: 4px; font-size: 20px; font-weight: 500; }
.meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 12px 0 8px; }
.meter i { display: block; height: 100%; background: var(--ink-2); border-radius: 4px; transition: width .3s ease; }
.meter.warn i { background: var(--warn); }
.meter.over i { background: var(--expense); }
.b-note { font-size: 13px; color: var(--ink-2); }
.b-note b { font-weight: 600; color: var(--ink); }
.b-note .over-txt { color: var(--expense); }
.s-budget .btn { margin-top: 10px; }

/* ---------- layout ---------- */
.grid {
  display: grid; gap: 16px; align-items: start;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "form" "list" "break";
}
.aside { display: contents; }
.form-panel { grid-area: form; }
.break-panel { grid-area: break; }
.list-panel { grid-area: list; min-width: 0; }
@media (min-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "list aside"; }
  .aside { display: flex; flex-direction: column; gap: 16px; grid-area: aside; position: sticky; top: 16px; }
  .form-panel, .break-panel { grid-area: auto; }
}

/* ---------- form ---------- */
form.tx-form { display: grid; gap: 14px; margin-top: 14px; }
.form-head { display: flex; justify-content: space-between; align-items: baseline; }
.form-panel.is-editing { border-color: var(--ink-2); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.ctl {
  width: 100%; min-width: 0; height: 42px; padding: 0 12px;
  border: 1px solid var(--line); background: var(--field); border-radius: 8px;
}
.ctl::placeholder { color: var(--muted); opacity: .7; }
.amount-wrap { position: relative; }
.amount-wrap .ctl { height: 52px; padding-right: 40px; text-align: right; font-family: var(--mono); font-size: 22px; font-weight: 500; }
.amount-wrap span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { color: var(--expense); font-size: 13px; }
.actions { display: flex; gap: 8px; }
.actions .primary { flex: 1; }

.seg {
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
  padding: 3px; background: var(--field); border: 1px solid var(--line); border-radius: 10px;
}
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label, .seg button {
  text-align: center; padding: 8px 14px; border-radius: 7px; border: 0; background: transparent;
  font-weight: 500; font-size: 14px; color: var(--ink-2); cursor: pointer;
}
#k-expense:checked + label { background: var(--expense); color: var(--on-color); }
#k-income:checked + label { background: var(--income); color: var(--on-color); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg.filter button { padding: 5px 12px; font-size: 13px; }
.seg.filter button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

/* ---------- list ---------- */
.list-head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 14px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
}
.list-head .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 260px; justify-content: flex-end; }
.list-head .ctl { height: 36px; width: auto; flex: 1 1 140px; max-width: 220px; -webkit-appearance: none; appearance: none; }
.count { margin-left: 6px; font-size: 13px; font-weight: 400; color: var(--muted); }
#list { padding-bottom: 8px; }
.day { padding: 0 20px; }
.day-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 16px 0 8px; border-bottom: 1px solid var(--ink-2);
}
.day-head h3 { font-size: 13.5px; font-weight: 700; }
.day-head h3 span { margin-left: 6px; font-weight: 400; color: var(--muted); }
.day-sum { display: flex; gap: 12px; font-size: 12.5px; }
.day-sum .in { color: var(--income); }
.day-sum .out { color: var(--expense); }
.day ul { list-style: none; margin: 0; padding: 0; }
.tx {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px 8px;
  padding: 10px 0; border-bottom: 1px solid var(--line-soft);
}
.day ul .tx:last-child { border-bottom: 0; }
.tx.editing { background: var(--field); margin-inline: -8px; padding-inline: 8px; border-radius: 8px; border-bottom-color: transparent; }
.tx-main { display: flex; flex-direction: column; min-width: 0; }
.memo { font-weight: 500; overflow-wrap: anywhere; }
.cat { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 400; color: var(--muted); vertical-align: 1px; }
.amt { font-family: var(--mono); font-weight: 500; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt.income { color: var(--income); }
.amt.expense { color: var(--expense); }
.tx-actions { display: flex; }
.iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted);
}
.iconbtn:hover { background: var(--field); color: var(--ink); }
.iconbtn.del:hover { color: var(--expense); }
.empty { padding: 40px 24px; text-align: center; color: var(--muted); }

/* ---------- breakdown ---------- */
.bd { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 13px; }
.b-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; }
.b-val { color: var(--ink-2); white-space: nowrap; }
.b-val em { font-style: normal; margin-left: 6px; font-size: 12px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--expense); }
.break-panel .empty { padding: 20px 0 4px; text-align: left; font-size: 13.5px; }

/* ---------- footer, dialog, toast ---------- */
.data { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.data p { flex: 1 1 100%; }
dialog {
  width: min(92vw, 360px); padding: 22px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); color: var(--ink);
}
dialog::backdrop { background: rgba(8, 12, 17, .55); }
dialog form { display: grid; gap: 14px; }
dialog .actions { justify-content: flex-end; flex-wrap: wrap; }
dialog .actions .primary { flex: 0 0 auto; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 16px; max-width: calc(100vw - 32px);
  padding: 11px 16px; border-radius: 10px; font-size: 14px;
  background: var(--toast-bg); color: var(--toast-fg);
}
#toast button { border: 0; background: none; padding: 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brandrow">
      <h1 class="brand">가계부</h1>
      <button type="button" class="chip" id="today" hidden>이번 달로</button>
    </div>
    <nav class="month" aria-label="월 이동">
      <button type="button" class="navbtn" id="prev" aria-label="이전 달">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="month-label" id="monthLabel" aria-live="polite"></div>
      <button type="button" class="navbtn" id="next" aria-label="다음 달">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </nav>
  </header>

  <div class="notice top-warn" id="warn" role="status" hidden>
    <span>이 브라우저에서는 저장이 막혀 있어요. 창을 닫으면 입력한 내용이 사라지니, 아래 ‘백업 저장’으로 파일을 보관해 주세요.</span>
  </div>

  <section class="panel summary" aria-label="월간 요약">
    <div class="s-balance">
      <div class="label" id="balLabel"></div>
      <div class="big" id="bal"></div>
    </div>
    <div class="s-flows">
      <dl class="flows">
        <div class="flow in"><dt>수입</dt><dd id="inc"></dd></div>
        <div class="flow out"><dt>지출</dt><dd id="exp"></dd></div>
      </dl>
      <p class="hint" id="prevExp"></p>
    </div>
    <div class="s-budget" id="budget"></div>
  </section>

  <main class="grid">
    <div class="aside">
      <section class="panel pad form-panel" id="formPanel" aria-labelledby="formTitle">
        <div class="form-head"><h2 id="formTitle">내역 추가</h2></div>
        <form class="tx-form" id="txForm" autocomplete="off" novalidate>
          <div class="seg" role="radiogroup" aria-label="구분">
            <input type="radio" name="kind" id="k-expense" value="expense" checked>
            <label for="k-expense">지출</label>
            <input type="radio" name="kind" id="k-income" value="income">
            <label for="k-income">수입</label>
          </div>
          <div class="field">
            <label for="f-amount">금액</label>
            <div class="amount-wrap">
              <input class="ctl" id="f-amount" inputmode="numeric" placeholder="0" aria-describedby="formErr">
              <span aria-hidden="true">원</span>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="f-date">날짜</label>
              <input class="ctl" type="date" id="f-date">
            </div>
            <div class="field">
              <label for="f-cat">분류</label>
              <select class="ctl" id="f-cat"></select>
            </div>
          </div>
          <div class="field">
            <label for="f-memo">메모</label>
            <input class="ctl" id="f-memo" list="memoList" maxlength="60" placeholder="예: 점심 김치찌개">
            <datalist id="memoList"></datalist>
          </div>
          <p class="err" id="formErr" role="alert" hidden></p>
          <div class="actions">
            <button type="submit" class="btn primary" id="submitBtn">추가</button>
            <button type="button" class="btn" id="cancelEdit" hidden>취소</button>
          </div>
        </form>
      </section>

      <section class="panel pad break-panel" aria-labelledby="bdTitle">
        <h2 id="bdTitle">분류별 지출</h2>
        <div id="breakdown"></div>
      </section>
    </div>

    <section class="panel list-panel" aria-labelledby="listTitle">
      <div class="notice" id="sampleNotice" hidden>
        <span>지금 보이는 내역 중 <b>‘예시’</b> 표시가 있는 것은 화면 구성을 보여 주는 샘플이에요. 직접 쓰기 전에 지워 주세요.</span>
        <button type="button" class="btn sm" id="clearSample">예시 지우고 시작</button>
      </div>
      <div class="list-head">
        <h2 id="listTitle">내역<span class="count" id="count"></span></h2>
        <div class="tools">
          <div class="seg filter" id="filter" role="group" aria-label="구분 필터">
            <button type="button" data-filter="all" aria-pressed="true">전체</button>
            <button type="button" data-filter="expense" aria-pressed="false">지출</button>
            <button type="button" data-filter="income" aria-pressed="false">수입</button>
          </div>
          <input class="ctl" type="search" id="q" placeholder="메모·분류 검색" aria-label="내역 검색">
        </div>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <footer class="data">
    <p>내역은 이 브라우저에만 저장돼요. 다른 기기나 브라우저에서 쓰려면 백업 파일로 옮겨 주세요.</p>
    <button type="button" class="btn sm" id="expJson">백업 저장 (JSON)</button>
    <button type="button" class="btn sm" id="expCsv">엑셀용 CSV</button>
    <button type="button" class="btn sm" id="impBtn">백업 불러오기</button>
    <button type="button" class="btn sm danger" id="wipe">내역 전체 삭제</button>
  </footer>
</div>

<dialog id="budgetDlg" aria-labelledby="budgetTitle">
  <form method="dialog" id="budgetForm">
    <h2 id="budgetTitle">월 예산</h2>
    <div class="field">
      <label for="budgetInput">한 달에 쓸 수 있는 금액</label>
      <div class="amount-wrap">
        <input class="ctl" id="budgetInput" inputmode="numeric" placeholder="0">
        <span aria-hidden="true">원</span>
      </div>
    </div>
    <div class="actions">
      <button type="submit" class="btn" value="clear" formnovalidate>예산 없음</button>
      <button type="submit" class="btn" value="cancel" formnovalidate>취소</button>
      <button type="submit" class="btn primary" value="save">저장</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

const KEY = 'gagyebu.v1';
const CATS = {
  expense: ['식비', '카페·간식', '교통', '주거·통신', '쇼핑', '의료·건강', '문화·여가', '경조사', '기타 지출'],
  income: ['급여', '용돈', '부수입', '이자·환급', '기타 수입'],
};
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const ICON = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON_EDIT = ICON('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
const ICON_DEL = ICON('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>');

const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const won = (n) => Math.abs(n).toLocaleString('ko-KR');
const num = (n) => `<span class="num">${won(n)}</span><span class="won">원</span>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mkey = (y, m) => `${y}-${pad(m + 1)}`;
const parseAmount = (s) => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
const uid = () => {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
};

/* ---------- storage ---------- */
let storageOk = true;

function seed() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const pm = new Date(y, m - 1, 1);
  // [일, 구분, 분류, 메모, 금액]
  const cur = [
    [1, 'expense', '주거·통신', '월세', 450000],
    [1, 'expense', '주거·통신', '휴대폰 요금', 55000],
    [2, 'expense', '식비', '장보기 (마트)', 68400],
    [3, 'expense', '카페·간식', '카페 라떼', 5500],
    [4, 'expense', '교통', '지하철 정기권', 62000],
    [5, 'expense', '식비', '점심 김치찌개', 9000],
    [6, 'expense', '문화·여가', '영화', 14000],
    [7, 'expense', '식비', '치킨 배달', 23000],
    [8, 'expense', '쇼핑', '운동화', 89000],
    [9, 'expense', '카페·간식', '아메리카노', 4500],
    [10, 'income', '급여', `${m + 1}월 급여`, 2850000],
    [11, 'expense', '의료·건강', '약국', 7800],
    [12, 'expense', '식비', '점심 비빔밥', 10000],
    [13, 'expense', '경조사', '축의금', 100000],
    [14, 'expense', '식비', '장보기 (시장)', 41200],
    [15, 'income', '부수입', '중고거래', 35000],
    [16, 'expense', '교통', '택시', 13800],
    [17, 'expense', '카페·간식', '아메리카노', 4500],
    [18, 'expense', '식비', '저녁 삼겹살', 34000],
    [19, 'expense', '문화·여가', 'OTT 구독', 13500],
    [20, 'expense', '식비', '점심 국밥', 9500],
    [21, 'expense', '카페·간식', '카페 라떼', 5500],
  ];
  const prev = [
    [1, 'expense', '주거·통신', '월세', 450000],
    [1, 'expense', '주거·통신', '휴대폰 요금', 55000],
    [3, 'expense', '식비', '장보기 (마트)', 72300],
    [8, 'expense', '식비', '외식', 38000],
    [10, 'income', '급여', `${pm.getMonth() + 1}월 급여`, 2850000],
    [12, 'expense', '교통', '지하철 정기권', 62000],
    [15, 'expense', '쇼핑', '겨울 외투', 120000],
    [20, 'expense', '문화·여가', '전시회', 28000],
    [24, 'expense', '식비', '장보기 (시장)', 44600],
  ];
  const tx = [];
  const add = (yy, mm, [d, type, cat, memo, amount]) =>
    tx.push({ id: uid(), date: `${yy}-${pad(mm + 1)}-${pad(d)}`, type, cat, memo, amount, sample: true });
  prev.forEach((r) => add(pm.getFullYear(), pm.getMonth(), r));
  cur.filter((r) => r[0] <= today).forEach((r) => add(y, m, r));
  return { v: 1, budget: 1500000, tx };
}

function normalize(d) {
  if (!d || !Array.isArray(d.tx)) return null;
  const tx = d.tx
    .filter((t) => t && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && (t.type === 'expense' || t.type === 'income') && Number.isFinite(+t.amount) && +t.amount > 0)
    .map((t) => ({
      id: String(t.id || uid()),
      date: t.date,
      type: t.type,
      cat: String(t.cat || (t.type === 'income' ? '기타 수입' : '기타 지출')),
      memo: String(t.memo || ''),
      amount: Math.round(+t.amount),
      ...(t.sample ? { sample: true } : {}),
    }));
  const b = Math.round(+d.budget);
  return { v: 1, budget: Number.isFinite(b) && b > 0 ? b : 0, tx };
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; return seed(); }
  if (raw === null) return seed();
  try {
    const d = normalize(JSON.parse(raw));
    if (d) return d;
  } catch (e) {}
  // 저장된 내용이 깨진 경우: 덮어쓰기 전에 원본을 따로 보관한다.
  try { localStorage.setItem(KEY + '.broken', raw); } catch (e) {}
  return { v: 1, budget: 0, tx: [] };
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { storageOk = false; }
  $('#warn').hidden = storageOk;
}

/* ---------- state ---------- */
let db = load();
const now0 = new Date();
let view = { y: now0.getFullYear(), m: now0.getMonth() };
const ui = { filter: 'all', q: '', editId: null };

const f = {
  kindE: $('#k-expense'), kindI: $('#k-income'),
  amount: $('#f-amount'), date: $('#f-date'), cat: $('#f-cat'), memo: $('#f-memo'),
};
const kind = () => (f.kindI.checked ? 'income' : 'expense');
const isCurrentMonth = () => { const n = new Date(); return view.y === n.getFullYear() && view.m === n.getMonth(); };
const defaultDate = () => (isCurrentMonth() ? ymd(new Date()) : `${mkey(view.y, view.m)}-01`);
const monthTx = (y, m) => { const k = mkey(y, m); return db.tx.filter((t) => t.date.startsWith(k)); };
const sum = (arr, type) => arr.reduce((s, t) => (t.type === type ? s + t.amount : s), 0);

/* ---------- render ---------- */
function render() {
  $('#monthLabel').textContent = `${view.y}년 ${view.m + 1}월`;
  $('#today').hidden = isCurrentMonth();
  renderSummary();
  renderList();
  renderBreakdown();
  $('#sampleNotice').hidden = !db.tx.some((t) => t.sample);
  $('#warn').hidden = storageOk;
}

function renderSummary() {
  const list = monthTx(view.y, view.m);
  const inc = sum(list, 'income'), exp = sum(list, 'expense'), bal = inc - exp;
  $('#balLabel').textContent = `${view.m + 1}월 잔액`;
  $('#bal').className = 'big' + (bal < 0 ? ' neg' : '');
  $('#bal').innerHTML = (bal < 0 ? '<span class="sign">−</span>' : '') + num(bal);
  $('#inc').innerHTML = num(inc);
  $('#exp').innerHTML = num(exp);
  const pd = new Date(view.y, view.m - 1, 1);
  const pe = sum(monthTx(pd.getFullYear(), pd.getMonth()), 'expense');
  $('#prevExp').textContent = pe ? `${pd.getMonth() + 1}월 지출 합계 ${won(pe)}원` : '';
  renderBudget(exp);
}

function renderBudget(exp) {
  const el = $('#budget');
  if (!db.budget) {
    el.innerHTML = `<div class="label">월 예산</div>
      <p class="b-note" style="margin-top:6px">한 달 지출 한도를 정해 두면 얼마나 썼는지 바로 보여요.</p>
      <button type="button" class="btn sm" data-act="budget">예산 정하기</button>`;
    return;
  }
  const pct = (exp / db.budget) * 100;
  const left = db.budget - exp;
  const cls = pct > 100 ? 'over' : pct >= 80 ? 'warn' : '';
  el.innerHTML = `<div class="b-head"><span class="label">월 예산</span><button type="button" class="linkbtn" data-act="budget">변경</button></div>
    <div class="b-amount">${num(db.budget)}</div>
    <div class="meter ${cls}" role="progressbar" aria-label="예산 사용률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100, Math.round(pct))}"><i style="width:${Math.min(100, pct).toFixed(1)}%"></i></div>
    <p class="b-note">${left >= 0
      ? `${won(exp)}원 사용 · <b>${won(left)}원 남음</b> (${Math.round(pct)}%)`
      : `<b class="over-txt">${won(-left)}원 초과</b> · ${won(exp)}원 사용 (${Math.round(pct)}%)`}</p>`;
}

function renderList() {
  const all = monthTx(view.y, view.m);
  const q = ui.q.trim().toLowerCase();
  const items = all
    .map((t, i) => ({ t, i }))
    .filter(({ t }) => (ui.filter === 'all' || t.type === ui.filter) && (!q || `${t.memo} ${t.cat}`.toLowerCase().includes(q)));
  $('#count').textContent = items.length ? `${items.length}건` : '';
  document.querySelectorAll('#filter button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === ui.filter)));

  if (!items.length) {
    $('#list').innerHTML = `<p class="empty">${all.length
      ? '조건에 맞는 내역이 없어요.'
      : `${view.m + 1}월에는 아직 내역이 없어요. 입력창에서 첫 내역을 추가해 보세요.`}</p>`;
    return;
  }
  // 날짜 최신순, 같은 날에는 나중에 입력한 것이 위로
  items.sort((a, b) => (a.t.date < b.t.date ? 1 : a.t.date > b.t.date ? -1 : b.i - a.i));
  const groups = [];
  for (const { t } of items) {
    const g = groups[groups.length - 1];
    if (g && g.date === t.date) g.items.push(t); else groups.push({ date: t.date, items: [t] });
  }
  $('#list').innerHTML = groups.map((g) => {
    const [y, m, d] = g.date.split('-').map(Number);
    const dow = DOW[new Date(y, m - 1, d).getDay()];
    const gi = sum(g.items, 'income'), ge = sum(g.items, 'expense');
    const rows = g.items.map((t) => {
      const main = t.memo || t.cat;
      return `<li class="tx${ui.editId === t.id ? ' editing' : ''}" data-id="${esc(t.id)}">
        <div class="tx-main"><span class="memo">${esc(main)}${t.sample ? '<span class="tag">예시</span>' : ''}</span>${t.memo ? `<span class="cat">${esc(t.cat)}</span>` : ''}</div>
        <div class="amt ${t.type}">${t.type === 'income' ? '+' : '−'}${won(t.amount)}<span class="won">원</span></div>
        <div class="tx-actions">
          <button type="button" class="iconbtn" data-act="edit" aria-label="${esc(main)} 수정">${ICON_EDIT}</button>
          <button type="button" class="iconbtn del" data-act="del" aria-label="${esc(main)} 삭제">${ICON_DEL}</button>
        </div>
      </li>`;
    }).join('');
    return `<section class="day">
      <div class="day-head"><h3>${d}일<span>${dow}요일</span></h3>
        <div class="day-sum num">${gi ? `<span class="in">+${won(gi)}</span>` : ''}${ge ? `<span class="out">−${won(ge)}</span>` : ''}</div></div>
      <ul>${rows}</ul></section>`;
  }).join('');
}

function renderBreakdown() {
  const list = monthTx(view.y, view.m).filter((t) => t.type === 'expense');
  const total = list.reduce((s, t) => s + t.amount, 0);
  if (!total) {
    $('#breakdown').innerHTML = '<p class="empty">지출 내역이 생기면 분류별 비중이 여기에 표시돼요.</p>';
    return;
  }
  const by = {};
  list.forEach((t) => { by[t.cat] = (by[t.cat] || 0) + t.amount; });
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  $('#breakdown').innerHTML = `<ul class="bd">${rows.map(([cat, v]) => {
    const p = (v / total) * 100;
    return `<li><div class="b-top"><span>${esc(cat)}</span><span class="b-val"><span class="num">${won(v)}</span>원<em>${p < 1 ? '<1' : Math.round(p)}%</em></span></div>
      <div class="bar"><i style="width:${p.toFixed(1)}%"></i></div></li>`;
  }).join('')}</ul>`;
}

/* ---------- form ---------- */
function fillCats(selected) {
  const type = kind();
  const opts = selected && !CATS[type].includes(selected) ? [...CATS[type], selected] : CATS[type];
  f.cat.innerHTML = opts.map((c) => `<option${c === selected ? ' selected' : ''}>${esc(c)}</option>`).join('');
}

function fillMemoList() {
  const seen = new Set(), out = [];
  for (let i = db.tx.length - 1; i >= 0 && out.length < 30; i--) {
    const m = db.tx[i].memo;
    if (m && !seen.has(m)) { seen.add(m); out.push(m); }
  }
  $('#memoList').innerHTML = out.map((m) => `<option value="${esc(m)}">`).join('');
}

function fmtInput(el) {
  const pos = el.selectionStart ?? el.value.length;
  const before = el.value.slice(0, pos).replace(/\D/g, '').length;
  const digits = el.value.replace(/\D/g, '').slice(0, 11).replace(/^0+(?=\d)/, '');
  el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  let p = 0, c = 0;
  while (p < el.value.length && c < before) { if (/\d/.test(el.value[p])) c++; p++; }
  try { el.setSelectionRange(p, p); } catch (e) {}
}

function showErr(msg) {
  const el = $('#formErr');
  el.textContent = msg;
  el.hidden = !msg;
}

function startEdit(id) {
  const t = db.tx.find((x) => x.id === id);
  if (!t) return;
  ui.editId = id;
  (t.type === 'income' ? f.kindI : f.kindE).checked = true;
  fillCats(t.cat);
  f.amount.value = won(t.amount);
  f.date.value = t.date;
  f.memo.value = t.memo;
  $('#formTitle').textContent = '내역 수정';
  $('#submitBtn').textContent = '저장';
  $('#cancelEdit').hidden = false;
  $('#formPanel').classList.add('is-editing');
  showErr('');
  renderList();
  if (!matchMedia('(min-width: 900px)').matches) {
    $('#formPanel').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  f.amount.focus({ preventScroll: true });
}

function endEdit(resetFields) {
  ui.editId = null;
  $('#formTitle').textContent = '내역 추가';
  $('#submitBtn').textContent = '추가';
  $('#cancelEdit').hidden = true;
  $('#formPanel').classList.remove('is-editing');
  if (resetFields) { f.amount.value = ''; f.memo.value = ''; f.date.value = defaultDate(); }
  showErr('');
  renderList();
}

function del(id) {
  const i = db.tx.findIndex((x) => x.id === id);
  if (i < 0) return;
  const [t] = db.tx.splice(i, 1);
  if (ui.editId === id) endEdit(true);
  save(); fillMemoList(); render();
  toast('내역을 삭제했어요.', '되돌리기', () => {
    db.tx.splice(Math.min(i, db.tx.length), 0, t);
    save(); fillMemoList(); render();
  });
}

/* ---------- toast ---------- */
let toastTimer;
function hideToast() { $('#toast').hidden = true; }
function toast(msg, label, fn) {
  const el = $('#toast');
  el.textContent = '';
  const s = document.createElement('span');
  s.textContent = msg;
  el.append(s);
  if (label) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', () => { fn(); hideToast(); });
    el.append(b);
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, label ? 7000 : 2600);
}

/* ---------- events ---------- */
function shift(delta) {
  const d = new Date(view.y, view.m + delta, 1);
  view = { y: d.getFullYear(), m: d.getMonth() };
  if (!ui.editId) f.date.value = defaultDate();
  render();
}
$('#prev').addEventListener('click', () => shift(-1));
$('#next').addEventListener('click', () => shift(1));
$('#today').addEventListener('click', () => {
  const n = new Date();
  view = { y: n.getFullYear(), m: n.getMonth() };
  if (!ui.editId) f.date.value = defaultDate();
  render();
});

[f.kindE, f.kindI].forEach((r) => r.addEventListener('change', () => fillCats()));
f.amount.addEventListener('input', () => fmtInput(f.amount));
$('#budgetInput').addEventListener('input', () => fmtInput($('#budgetInput')));

$('#txForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const amount = parseAmount(f.amount.value);
  if (!amount) { showErr('금액을 입력해 주세요.'); f.amount.focus(); return; }
  if (!f.date.value) { showErr('날짜를 선택해 주세요.'); f.date.focus(); return; }
  showErr('');
  const t = { date: f.date.value, type: kind(), cat: f.cat.value, memo: f.memo.value.trim(), amount };
  const editing = ui.editId;
  if (editing) {
    const i = db.tx.findIndex((x) => x.id === editing);
    if (i >= 0) db.tx[i] = { ...t, id: editing };
    ui.editId = null;
    $('#formTitle').textContent = '내역 추가';
    $('#submitBtn').textContent = '추가';
    $('#cancelEdit').hidden = true;
    $('#formPanel').classList.remove('is-editing');
    toast('수정했어요.');
  } else {
    db.tx.push({ id: uid(), ...t });
    toast(`${t.type === 'income' ? '수입' : '지출'} ${won(amount)}원을 추가했어요.`);
  }
  save();
  const [y, m] = t.date.split('-').map(Number);
  view = { y, m: m - 1 };
  f.amount.value = '';
  f.memo.value = '';
  if (editing) f.date.value = defaultDate();
  fillMemoList();
  render();
  f.amount.focus();
});
$('#cancelEdit').addEventListener('click', () => endEdit(true));
$('#txForm').addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.editId) endEdit(true); });

$('#list').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.closest('.tx').dataset.id;
  if (b.dataset.act === 'edit') startEdit(id); else del(id);
});

$('#filter').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-filter]');
  if (!b) return;
  ui.filter = b.dataset.filter;
  renderList();
});
$('#q').addEventListener('input', (e) => { ui.q = e.target.value; renderList(); });

$('#clearSample').addEventListener('click', () => {
  db.tx = db.tx.filter((t) => !t.sample);
  if (ui.editId && !db.tx.some((t) => t.id === ui.editId)) endEdit(true);
  save(); fillMemoList(); render();
  toast('예시를 지웠어요. 이제 직접 입력해 보세요.');
});

/* ---------- budget ---------- */
const dlg = $('#budgetDlg');
$('#budget').addEventListener('click', (e) => {
  if (!e.target.closest('[data-act="budget"]')) return;
  const inp = $('#budgetInput');
  inp.value = db.budget ? won(db.budget) : '';
  dlg.showModal();
  inp.select();
});
$('#budgetForm').addEventListener('submit', (e) => {
  const v = e.submitter && e.submitter.value;
  if (v === 'save') db.budget = parseAmount($('#budgetInput').value);
  else if (v === 'clear') db.budget = 0;
  else return;
  save(); render();
});

/* ---------- backup ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const stamp = () => ymd(new Date()).replace(/-/g, '');

$('#expJson').addEventListener('click', () => {
  download(`가계부-백업-${stamp()}.json`, JSON.stringify(db, null, 1), 'application/json');
});
$('#expCsv').addEventListener('click', () => {
  const q = (c) => `"${String(c).replace(/"/g, '""')}"`;
  const rows = [...db.tx].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
    .map((t) => [t.date, t.type === 'income' ? '수입' : '지출', t.cat, t.amount, t.memo].map(q).join(','));
  download(`가계부-${stamp()}.csv`, '﻿' + ['날짜,구분,분류,금액,메모', ...rows].join('\r\n'), 'text/csv;charset=utf-8');
});
$('#impBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const d = normalize(JSON.parse(await file.text()));
    if (!d) throw new Error('bad format');
    if (!confirm(`현재 내역 ${db.tx.length}건이 사라지고, 백업 파일의 ${d.tx.length}건으로 바뀝니다. 계속할까요?`)) return;
    db = d;
    endEdit(true);
    save(); fillMemoList(); render();
    toast('백업을 불러왔어요.');
  } catch (err) {
    toast('불러오지 못했어요. 이 가계부에서 저장한 JSON 파일인지 확인해 주세요.');
  }
});
$('#wipe').addEventListener('click', () => {
  if (!db.tx.length) { toast('지울 내역이 없어요.'); return; }
  if (!confirm(`내역 ${db.tx.length}건을 모두 지울까요? 되돌릴 수 없으니 먼저 백업을 저장해 두는 걸 권해요.`)) return;
  db.tx = [];
  endEdit(true);
  save(); fillMemoList(); render();
  toast('내역을 모두 지웠어요.');
});

/* ---------- init ---------- */
fillCats();
f.date.value = defaultDate();
fillMemoList();
render();
})();
</script>
</body>
</html>
